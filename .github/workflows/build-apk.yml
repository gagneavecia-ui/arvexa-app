name: Build APK

# ARVX — l'APK est fabriqué par la pipeline : prebuild Expo puis Gradle.
# Chaque poussée sur main produit un artefact testable ;
# chaque tag v* produit en plus une Release publique avec l'APK joint.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    name: Expo prebuild → Gradle assembleRelease
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK Android : déjà préinstallé sur les runners ubuntu-latest,
      # android-actions/setup-android@v3 échoue sur le package « tools » déprécié.
      # ANDROID_HOME et les licences sont déjà configurés par le runner.

      - name: Installer les dépendances
        run: npm ci

      - name: Prebuild Expo (android)
        run: npx expo prebuild -p android --clean
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Construire l'APK (release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ARVX-1.0.0.apk
          ls -lh ARVX-1.0.0.apk

      - name: Publier l'artefact (chaque poussée)
        uses: actions/upload-artifact@v4
        with:
          name: ARVX-APK
          path: ARVX-1.0.0.apk

      - name: Créer la Release (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ARVX-1.0.0.apk
          body: |
            ARVX 1.0.0 — première version publiée.

            - Modèle « apporte ton cours » : détection de la matière, résumé, pas à pas, banque de questions
            - Examens ciblé et global fabriqués à partir des cours fournis
            - Progression agrégée Réviser + Examens
            - Design system « Encre claire » (référence AXIA)

            Installer : télécharger l'APK sur un Android 8+ et autoriser l'installation d'une source inconnue.
          generate_release_notes: true
