<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ARVX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVX — toutes les matières, une seule application.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Anti-flash thème : même mécanique que ARVEXA School (localStorage 'arvexa-theme') -->
  <script>(function(){try{if(localStorage.getItem('arvexa-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}})();</script>

  <!-- Font Awesome : même CDN et même version que le site original -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Polices : mêmes familles que le site original (Inter + Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/design-system.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       MENU (tiroir) — design fidèle à la sidebar du site
       original. La navigation est vide pour l'instant :
       elle sera complétée à une prochaine étape.
       Le logo ARVX s'affiche en haut du menu, X en doré
       (dégradé or, façon le logo du site original).
       ══════════════════════════════════════════════════════ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <a href="#/accueil" class="logo" aria-label="ARVX">ARV<span>X</span></a>
    <nav class="nav">
      <!-- ═══ MON COMPTE ═══ -->
      <div class="nav-label">Mon compte</div>
      <a href="#/profil" class="nav-item" data-route="profil">
        <i class="fas fa-user" aria-hidden="true"></i> Profil
      </a>
      <button type="button" class="nav-item" data-menu="abonnement">
        <i class="fas fa-crown" aria-hidden="true"></i> Mon abonnement
      </button>
      <div class="nav-divider" role="separator"></div>

      <!-- ═══ INVITER DES GENS ═══ -->
      <div class="nav-label">Inviter des gens</div>
      <button type="button" class="nav-item" data-menu="camarades">
        <i class="fas fa-user-plus" aria-hidden="true"></i> Inviter des camarades
      </button>
      <button type="button" class="nav-item" data-menu="parrainage">
        <i class="fas fa-gift" aria-hidden="true"></i> Parrainage
      </button>
      <div class="nav-divider" role="separator"></div>

      <!-- ═══ AIDE ET SUPPORT ═══ -->
      <div class="nav-label">Aide et support</div>
      <button type="button" class="nav-item" data-menu="notifications">
        <i class="fas fa-bell" aria-hidden="true"></i> Rappels et notifications
      </button>
      <button type="button" class="nav-item" data-menu="compte">
        <i class="fas fa-user-shield" aria-hidden="true"></i> Compte et suppression
      </button>
      <button type="button" class="nav-item" data-menu="support">
        <i class="fas fa-headset" aria-hidden="true"></i> Contacter le support
      </button>
    </nav>
  </aside>

  <!-- ══════════════════════════════════════════════════════
       PAGE
       ══════════════════════════════════════════════════════ -->
  <main class="page">

    <!-- ===== BARRE DU HAUT — identique au header d'accueil
         du site original : menu, salutation + nom, notifications,
         profil, rafraîchissement ===== -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="greeting">
          <span id="greetingText">Bonjour</span>
          <span id="userFirstName">ARV<span class="gold-x">X</span></span>
          <span id="greetingEmoji">👋</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="notifBtn" aria-label="Notifications">
          <i class="fas fa-bell"></i>
          <span class="notif-dot" id="notifDot"></span>
        </button>
        <button id="profileBtn" aria-label="Profil">
          <i class="fas fa-user"></i>
        </button>
        <button id="refreshBtn" aria-label="Rafraîchir" title="Rafraîchir les données">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════════════
         VUES SPA — une seule page qui ne se recharge JAMAIS.
         Les 5 écrans sont échangés instantanément en JS
         (principe AXIA : pas de navigation document, donc
         jamais de barre de chargement du navigateur).
         Le contenu de chaque vue arrive étape par étape.
         ══════════════════════════════════════════════════════ -->
    <section class="view" id="view-accueil" data-view="accueil"><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-reviser" data-view="reviser" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-examen" data-view="examen" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-progression" data-view="progression" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-profil" data-view="profil" hidden><!-- contenu — étapes suivantes --></section>

  </main>

  <!-- ══════════════════════════════════════════════════════
       BARRE DE TÂCHES FIXE EN BAS — design « luxe ».
       Chaque onglet change de vue instantanément (SPA,
       URL synchronisée en #/route — zéro rechargement).
       ══════════════════════════════════════════════════════ -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button type="button" class="active" data-route="accueil" aria-current="page">
      <i class="fas fa-home" aria-hidden="true"></i><span>Accueil</span>
    </button>
    <button type="button" data-route="reviser">
      <i class="fas fa-book-open" aria-hidden="true"></i><span>Réviser</span>
    </button>
    <button type="button" data-route="examen">
      <i class="fas fa-pencil-alt" aria-hidden="true"></i><span>Examen</span>
    </button>
    <button type="button" data-route="progression">
      <i class="fas fa-chart-line" aria-hidden="true"></i><span>Progression</span>
    </button>
    <button type="button" data-route="profil">
      <i class="fas fa-user" aria-hidden="true"></i><span>Profil</span>
    </button>
  </nav>

</body>
</html>
