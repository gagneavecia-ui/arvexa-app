<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ARVEXA — Accueil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA — toutes les matières, une seule application.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Anti-flash thème : même mécanisme que ARVEXA School (localStorage 'arvexa-theme') -->
  <script>(function(){try{if(localStorage.getItem('arvexa-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}})();</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/design-system.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       PAGE D'ACCUEIL — VIDE (fondation design)
       Aucun bouton, aucune navigation, aucune interaction.
       Uniquement les couleurs fidèles du design ARVEXA.
       ══════════════════════════════════════════════════════ -->
  <main class="stage">

    <div class="brand">
      <span class="brand-rule" aria-hidden="true"></span>
      <h1 class="brand-name">ARVEXA</h1>
      <p class="brand-tagline">Toutes les matières. Une seule application.</p>
    </div>

    <ul class="palette" aria-label="Palette officielle ARVEXA">
      <li class="swatch"><span class="dot" style="--c:#0A0A0A"></span><span class="hex">0A0A0A</span><span class="name">fond</span></li>
      <li class="swatch"><span class="dot" style="--c:#141414"></span><span class="hex">141414</span><span class="name">surface</span></li>
      <li class="swatch"><span class="dot" style="--c:#1A3A2A"></span><span class="hex">1A3A2A</span><span class="name">primaire</span></li>
      <li class="swatch"><span class="dot" style="--c:#2A5A3A"></span><span class="hex">2A5A3A</span><span class="name">primaire clair</span></li>
      <li class="swatch"><span class="dot" style="--c:#B8860B"></span><span class="hex">B8860B</span><span class="name">or</span></li>
      <li class="swatch"><span class="dot" style="--c:#E0B84A"></span><span class="hex">E0B84A</span><span class="name">or vif</span></li>
      <li class="swatch"><span class="dot" style="--c:#F5F0E8"></span><span class="hex">F5F0E8</span><span class="name">texte</span></li>
    </ul>

  </main>

</body>
</html>
