<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      Aucun zoom (décision NOX, 2026-10-20) : ni pincement, ni double tap, ni zoom
      automatique d'iOS sur un champ. `maximum-scale=1` coupe aussi ce dernier.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>ARVEXA School</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /*
       * Pas de zoom tactile : pincement et double tap coupés (seuls les défilements
       * restent), et pas d'agrandissement du texte décidé par le navigateur.
       */
      html,
      body,
      #root {
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/arvx-apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/arvx-icon-192.png" />

    <!--
      iOS ne lit jamais le manifest pour ces réglages : sans ces balises,
      l'app ajoutée à l'écran d'accueil s'ouvrirait dans un onglet Safari
      avec sa barre d'adresse au lieu d'un plein écran autonome.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ARVEXA" />
  <meta name="theme-color" content="#0A0A0A">
<meta name="description" content="ARVEXA transforme tes cours en fiches de révision et en cartes mentales.">
<link rel="icon" href="/favicon.ico"/>    <script>
      /* ARVX phase 1 : thème par défaut = sombre (uniforme comme arvexaschool).
         Clé partagée avec l'app axia (localStorage 'axia.theme') : landing et
         application restent synchronisées. */
      (function () {
        var t = 'dark';
        var landing = location.pathname === '/';
        if (!landing) {
          try {
            var s = localStorage.getItem('axia.theme');
            if (s !== 'light' && s !== 'dark') { localStorage.setItem('axia.theme', 'dark'); }
            else { t = s; }
          } catch (e) {}
        }
        /* la landing est TOUJOURS noire, uniforme comme le vrai site ARVEXA ;
           l'application (après connexion) suit la bascule du bouton Profil. */
        document.documentElement.setAttribute('data-arvx', landing ? 'dark' : t);
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.setAttribute('content', (landing ? 'dark' : t) === 'dark' ? '#0A0A0A' : '#F5F0E8');
      })();
    </script>
    <!-- ARVX skin phase 1 : couleurs, barre du haut, bascule clair/sombre -->
    <style id="arvx-skin">
      html[data-arvx="dark"] {
        --arvx-brand-main: #F5F0E8;
        --arvx-brand-main-flip: #0A0A0A; /* rendu blanc une fois inversé */
        --arvx-brand-accent: #E0B84A;
        --arvx-bar-bg: rgba(10, 10, 10, 0.95);
        --arvx-bar-border: rgba(184, 134, 11, 0.08);
        --arvx-btn-bg: rgba(255, 255, 255, 0.06);
        --arvx-btn-border: rgba(255, 255, 255, 0.18);
        --arvx-btn-color: #F5F0E8;
        --arvx-page-bg: #0A0A0A;
      }
      html[data-arvx="light"] {
        --arvx-brand-main: #141414;
        --arvx-brand-accent: #B8860B;
        --arvx-bar-bg: rgba(250, 247, 240, 0.94);
        --arvx-bar-border: rgba(184, 134, 11, 0.08);
        --arvx-btn-bg: rgba(32, 27, 18, 0.05);
        --arvx-btn-border: rgba(32, 27, 18, 0.14);
        --arvx-btn-color: #3A3428;
        --arvx-page-bg: #F5F0E8;
      }
      /* fond uniforme : plus aucun bleu ni blanc visible en bas (rebond,
         overscroll, zones mortes) — noir en mode sombre, voile crème en clair */
      html, body { background: var(--arvx-page-bg, #0A0A0A) !important; }
      /* Barre du haut — réplique fidèle du header ARVEXA School */
      .arvx-topbar {
        background: var(--arvx-bar-bg) !important;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--arvx-bar-border) !important;
      }
      .arvx-topbar button {
        width: 36px !important; height: 36px !important; min-width: 36px !important;
        border-radius: 50% !important;
        background: var(--arvx-btn-bg) !important;
        border: none !important;
        color: var(--arvx-btn-color) !important;
      }
      .arvx-topbar button > div, .arvx-topbar button > div > div {
        color: var(--arvx-btn-color) !important;
      }
      .arvx-topbar button[aria-label="Menu"] {
        border-radius: 10px !important;
        border: 1px solid var(--arvx-btn-border) !important;
        background: transparent !important;
      }
      /* Mode sombre de la landing : #root inversé (le header et les modales
         suivent), images re-inversées pour rester naturelles */
      html[data-arvx="dark"] #root.arvx-inv { filter: invert(1) hue-rotate(180deg); }
      html[data-arvx="dark"] #root.arvx-inv img { filter: invert(1) hue-rotate(180deg); }
      /* contre-filtre sur les barres du haut de la landing : double inversion
         = couleurs natives de la barre (le skin ARVEXA reste intact) */
      .arvx-landing-bar { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Aucun zoom. Safari iOS ignore `user-scalable=no` depuis iOS 10 : le
      // pincement s'y bloque par ses événements `gesture*` et par les touchers à
      // plusieurs doigts. Sur ordinateur : Ctrl/Cmd + molette ou pavé tactile, et
      // Ctrl/Cmd + « + », « - », « = », « 0 ». (Le zoom du menu du navigateur reste
      // hors de portée d'une page.)
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
          document.addEventListener(type, stop, { passive: false });
        });
        document.addEventListener('touchmove', function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        window.addEventListener('wheel', function (e) {
          if (e.ctrlKey || e.metaKey) e.preventDefault();
        }, { passive: false });
        window.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].indexOf(e.key) !== -1) e.preventDefault();
        });
      })();

      // Service worker (cf. sw.js) : garde l'app pour qu'elle s'ouvre hors-ligne,
      // reçoit les pushes, et rend la PWA installable. Échoue silencieusement
      // là où il n'existe pas.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {});
        });
        /* Quand le nouveau service worker prend la main (après un déploiement),
           une seule rechargement automatique garantit l'affichage de la
           nouvelle version — même sur un appareil resté des semaines en cache. */
        navigator.serviceWorker.addEventListener('message', function (ev) {
          try {
            if (!ev.data || ev.data.type !== 'arvx-update') return;
            if (sessionStorage.getItem('arvx-recharge')) return;
            sessionStorage.setItem('arvx-recharge', '1');
            location.reload();
          } catch (e) {}
        });
      }
    </script>
    <script>
    /* ARVX skin — moteur : observe le DOM (les écrans React se re-rendent),
       étiquette les barres du haut (.arvx-topbar), inverse la landing en mode
       sombre (#root.arvx-inv) et pose la bascule clair/sombre dans la barre
       (à l'emplacement du bouton profil du site original). */
    (function () {
      var doc = document.documentElement;
      function mode() { return doc.getAttribute('data-arvx') || 'dark'; }
      function isApp() { if (location.pathname !== '/') return true; return !!document.querySelector('button[aria-label="Change theme"], button[aria-label="Changer de thème"]'); }

      function setMetaColor(m) {
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.setAttribute('content', m === 'dark' ? '#0A0A0A' : '#F5F0E8');
      }

      function setMode(m) {
        doc.setAttribute('data-arvx', m);
        try { localStorage.setItem('axia.theme', m); } catch (e) {}
        setMetaColor(m);
        paint();
      }

      function tagBars(landingFiltered) {
        var all = document.querySelectorAll('div');
        for (var i = 0; i < all.length; i++) {
          var e = all[i], r = e.getBoundingClientRect();
          if (r.width < 300 || r.top > 4 || r.height < 40 || r.height > 72) continue;
          if (!e.querySelector('button')) continue;
          var hasMenu = !!e.querySelector('button[aria-label="Menu"]');
          var hasTheme = !!e.querySelector('button[aria-label="Change theme"], button[aria-label="Changer de thème"]');
          if (!hasMenu && !hasTheme) continue;
          var txt = e.textContent || '';
          var hasBrand = !!e.querySelector('img[alt="ARVEXA logo"], img[alt="AXIA logo"]') || txt.indexOf('ARVEX') >= 0 || /(^|\s)axia(\s|$)/i.test(txt);
          if (!hasBrand) continue;
          if (!e.classList.contains('arvx-topbar')) e.classList.add('arvx-topbar');
          /* un seul contre-filtre : les barres peuvent être imbriquées
             (conteneur fixe + rangée) — ne le mettre que sur l'externe */
          var outerAlready = e.parentElement ? e.parentElement.closest('.arvx-landing-bar') : null;
          if (landingFiltered && !outerAlready) e.classList.add('arvx-landing-bar');
          if (!landingFiltered) e.classList.remove('arvx-landing-bar');
        }
      }

      /* Bloc « 98% » de la landing : blanc sur photo en clair ; en sombre,
         valeur pré-inversée pour ressortir crème après le filtre #root. */
      function paintRetention(m, app) {
        if (app) return;
        var all = document.querySelectorAll('#root div');
        for (var i = 0; i < all.length; i++) {
          var e = all[i];
          if (e.childElementCount !== 0 || e.textContent !== '98%') continue;
          var c = (m === 'dark') ? '#0A0F17' : '#FFFFFF';
          e.style.color = c;
          var cont = e.parentElement;
          if (cont) {
            var kids = cont.children;
            for (var j = 0; j < kids.length; j++) kids[j].style.color = c;
          }
          return;
        }
      }

      function paint() {
        if (!document.body) return;
        var m = mode(), app = isApp();
        var root = document.getElementById('root');
        var landingFiltered = (!app && m === 'dark');
        if (root) {
          if (landingFiltered && !root.classList.contains('arvx-inv')) root.classList.add('arvx-inv');
          if (!landingFiltered && root.classList.contains('arvx-inv')) root.classList.remove('arvx-inv');
        }
        tagBars(landingFiltered);
        paintRetention(m, app);
        /* « ARVEX » hors barres (ex. footer) : couleur pré-inversée pour rester
           lisible sur le fond sombre du contenu inversé */
        var sps = document.querySelectorAll('span');
        for (var i = 0; i < sps.length; i++) {
          if (sps[i].textContent !== 'ARVEX') continue;
          if (m === 'dark' && landingFiltered && !sps[i].closest('.arvx-landing-bar')) {
            sps[i].style.color = 'var(--arvx-brand-main-flip)';
          } else {
            sps[i].style.color = 'var(--arvx-brand-main)';
          }
        }
        /* Logo « ARVEXA School » du pied de page : il vit dans le contenu inversé,
           ses couleurs natives (crème + or) ressortaient noires. Un contre-filtre
           sur son conteneur le rend comme la barre du haut : couleurs exactes. */
        for (var i = 0; i < sps.length; i++) {
          if (sps[i].textContent !== 'ARVEXA') continue;
          if (!landingFiltered || sps[i].closest('.arvx-landing-bar')) continue;
          var pc = sps[i].parentElement;
          for (var k = 0; pc && k < 6; k++, pc = pc.parentElement) {
            var tc = pc.textContent || '';
            if (tc.indexOf('School') >= 0 && tc.indexOf('ARVEXA') >= 0 && tc.length < 40) {
              if (!pc.classList.contains('arvx-landing-bar')) pc.classList.add('arvx-landing-bar');
              break;
            }
          }
        }
      }

      var tt = null;
      var mo = new MutationObserver(function () {
        clearTimeout(tt); tt = setTimeout(paint, 120);
      });

      /* ARVX passe 5 : dans l'application, le bouton « Profil » de la barre
         d'onglets du bas devient la bascule mode clair / mode sombre. Le clic
         est intercepté AVANT React (capture au document), l'app suit par
         l'événement 'arvx-theme' et la clé 'axia.theme' que le ThemeProvider
         écoute désormais. L'écran Profil reste accessible via le menu ☰. */
      var LIBELLES_PROFIL = ['Profil', 'Profile'];
      var MARQUEURS_LIGNE = ['Ma\u00eetrise', 'Mastery'];
      function clicSurProfilBarre(el) {
        var p = el, prof = null, k;
        for (k = 0; p && k < 14 && !prof; k++) {
          var propre = (p.textContent || '').replace(/([\uE000-\uF8FF]|[\uDB80-\uDBBF][\uDC00-\uDFFF])/g, '').trim();
          if (LIBELLES_PROFIL.indexOf(propre) >= 0 && propre.length <= 8) prof = p;
          p = p.parentElement;
        }
        if (!prof) return false;
        var r = prof.getBoundingClientRect();
        if (r.top < window.innerHeight * 0.62) return false;
        var q = prof;
        for (k = 0; q && k < 10; k++) {
          var rr = q.getBoundingClientRect();
          if (rr.height <= 110 && rr.width >= window.innerWidth * 0.55) {
            var t2 = (q.textContent || '').replace(/([\uE000-\uF8FF]|[\uDB80-\uDBBF][\uDC00-\uDFFF])/g, '');
            for (var j2 = 0; j2 < MARQUEURS_LIGNE.length; j2++)
              if (t2.indexOf(MARQUEURS_LIGNE[j2]) >= 0) return true;
          }
          q = q.parentElement;
        }
        return false;
      }

      function start() {
        document.addEventListener('click', function (ev) {
          try {
            if (!clicSurProfilBarre(ev.target)) return;
            ev.preventDefault(); ev.stopPropagation();
            setMode(mode() === 'dark' ? 'light' : 'dark');
            try { window.dispatchEvent(new Event('arvx-theme')); } catch (e) {}
          } catch (e) {}
        }, true);
        paint();
        mo.observe(document.body, { childList: true, subtree: true });
        /* filet de sécurité : resynchronise avec axia.theme (la bascule native
           de l'app écrit cette clé) et re-applique le skin si besoin */
        setInterval(function () {
          if (location.pathname === '/') { paint(); return; }
          try {
            var t = localStorage.getItem('axia.theme');
            if ((t === 'light' || t === 'dark') && t !== mode()) {
              doc.setAttribute('data-arvx', t);
              setMetaColor(t);
            }
          } catch (e) {}
          paint();
        }, 600);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
