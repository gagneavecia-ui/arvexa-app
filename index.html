<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ARVX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVX — toutes les matières, une seule application.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Anti-flash thème : même mécanique que ARVEXA School (localStorage 'arvexa-theme') -->
  <script>(function(){try{if(localStorage.getItem('arvexa-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}})();</script>

  <!-- Font Awesome : même CDN et même version que le site original -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Polices : mêmes familles que le site original (Inter + Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/design-system.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════
       MENU (tiroir) — design fidèle à la sidebar du site
       original. Ligne du logo : ARVX (X en doré, dégradé or)
       avec à droite deux mini boutons de langue FR / AN.
       Puis carte profil (photo, nom, type de compte) et les
       sections du menu. Tout est traduit instantanément
       (FR / AN) sans jamais recharger la page (principe AXIA).
       ══════════════════════════════════════════════════════ -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="sidebar-head">
      <a href="#/accueil" class="logo" aria-label="ARVX">ARV<span>X</span></a>
      <div class="lang-switch" role="group" aria-label="Langue">
        <button type="button" class="lang-btn active" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" class="lang-btn" data-lang="an" aria-pressed="false">AN</button>
      </div>
    </div>

    <!-- Carte profil : photo à gauche, nom, type de compte au-dessous -->
    <div class="profile-card">
      <span class="profile-avatar" id="profileAvatar" aria-hidden="true">É</span>
      <span class="profile-info">
        <span class="profile-name" id="profileName">Élève</span>
        <span class="profile-plan gratuit" id="profilePlan">Gratuit</span>
      </span>
    </div>
    <nav class="nav">
      <!-- ═══ MON COMPTE ═══ -->
      <div class="nav-label" data-i18n="menu.section.compte">Mon compte</div>
      <a href="#/profil" class="nav-item" data-route="profil">
        <i class="fas fa-user" aria-hidden="true"></i> <span data-i18n="menu.profil">Profil</span>
      </a>
      <button type="button" class="nav-item" data-menu="classe">
        <i class="fas fa-graduation-cap" aria-hidden="true"></i> <span data-i18n="menu.classe">Ma classe</span>
      </button>
      <button type="button" class="nav-item" data-menu="abonnement">
        <i class="fas fa-crown" aria-hidden="true"></i> <span data-i18n="menu.abonnement">Mon abonnement</span>
      </button>
      <div class="nav-divider" role="separator"></div>

      <!-- ═══ INVITER DES GENS ═══ -->
      <div class="nav-label" data-i18n="menu.section.inviter">Inviter des gens</div>
      <button type="button" class="nav-item" data-menu="camarades">
        <i class="fas fa-user-plus" aria-hidden="true"></i> <span data-i18n="menu.camarades">Inviter des camarades</span>
      </button>
      <button type="button" class="nav-item" data-menu="ambassadeur">
        <i class="fas fa-medal" aria-hidden="true"></i> <span data-i18n="menu.ambassadeur">Ambassadeur ARVX</span>
      </button>
      <div class="nav-divider" role="separator"></div>

      <!-- ═══ AIDE ET SUPPORT ═══ -->
      <div class="nav-label" data-i18n="menu.section.aide">Aide et support</div>
      <button type="button" class="nav-item" data-menu="notifications">
        <i class="fas fa-bell" aria-hidden="true"></i> <span data-i18n="menu.notifications">Rappels et notifications</span>
      </button>
      <button type="button" class="nav-item" data-menu="compte">
        <i class="fas fa-user-shield" aria-hidden="true"></i> <span data-i18n="menu.compte">Compte et suppression</span>
      </button>
      <button type="button" class="nav-item" data-menu="support">
        <i class="fas fa-headset" aria-hidden="true"></i> <span data-i18n="menu.support">Contacter le support</span>
      </button>

      <!-- ═══ BAS DU MENU : communauté + déconnexion ═══ -->
      <div class="nav-bottom">
        <a href="https://wa.me/22774872082" target="_blank" rel="noopener" class="whatsapp-btn"
           id="whatsappCommunityBtn" title="Rejoindre la communauté ARVX sur WhatsApp">
          <i class="fab fa-whatsapp" aria-hidden="true"></i> <span data-i18n="menu.communaute">Rejoindre la communauté</span>
        </a>
        <button type="button" class="logout-item" id="logoutBtn">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i> <span data-i18n="menu.deconnexion">Déconnexion</span>
        </button>
      </div>
    </nav>
  </aside>

  <!-- ══════════════════════════════════════════════════════
       PAGE
       ══════════════════════════════════════════════════════ -->
  <main class="page">

    <!-- ===== BARRE DU HAUT — header d'accueil du site original :
         menu, salutation + nom, notifications, BASCULE DE THÈME
         (clair / sombre en un clic, v0.5.1), rafraîchissement ===== -->
    <header class="header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Ouvrir le menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="greeting">
          <span id="greetingText">Bonjour</span>
          <span id="userFirstName">ARV<span class="gold-x">X</span></span>
          <span id="greetingEmoji">👋</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="notifBtn" aria-label="Notifications">
          <i class="fas fa-bell"></i>
          <span class="notif-dot" id="notifDot"></span>
        </button>
        <button id="themeBtn" aria-label="Passer en mode clair" title="Mode clair / mode sombre">
          <i class="fas fa-sun" id="themeIcon" aria-hidden="true"></i>
        </button>
        <button id="refreshBtn" aria-label="Rafraîchir" title="Rafraîchir les données">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
    </header>

    <!-- ══════════════════════════════════════════════════════
         VUES SPA — une seule page qui ne se recharge JAMAIS.
         Les 5 écrans sont échangés instantanément en JS
         (principe AXIA : pas de navigation document, donc
         jamais de barre de chargement du navigateur).
         Le contenu de chaque vue arrive étape par étape.
         ══════════════════════════════════════════════════════ -->
    <section class="view" id="view-accueil" data-view="accueil">
      <!-- ═══ BLOC 1 — CARTE STATISTIQUES (v0.6.1) ═══
           Héros compact = 1/4 du cadre entre la barre du haut et
           la barre du bas. Polyvalent (toutes matières) :
           à gauche le nombre de cours de l'élève + les cours
           lus et complétés ; à droite un anneau de progression
           (statistique visuelle) ; en bas la citation, façon
           site original (2 citations au démarrage, tirée au
           hasard — le bouton rafraîchir en propose une autre).
           Typographie expressive : Playfair Display pour le
           chiffre, le mot « cours » et la citation.
           Valeurs d'exemple tant que les cours réels n'existent
           pas (localStorage 'arvexa-stats'). -->
      <div class="stats-card">
        <div class="stats-top">
          <div class="stats-left">
            <span class="stats-eyebrow"><i class="fas fa-layer-group" aria-hidden="true"></i><span data-i18n="accueil.eyebrow">Mes cours</span></span>
            <span class="stats-num"><span class="stats-number" id="statCourses">12</span><span class="stats-numlabel" data-i18n="accueil.coursLabel">cours</span></span>
            <span class="stats-sub"><span class="stats-done" id="statDone">7</span> <span data-i18n="accueil.lus">lus et complétés</span></span>
          </div>
          <div class="stats-ring" aria-hidden="true">
            <svg viewBox="0 0 72 72" role="presentation">
              <circle class="stats-ring-track" cx="36" cy="36" r="30"></circle>
              <circle class="stats-ring-fill" id="ringFill" cx="36" cy="36" r="30"></circle>
            </svg>
            <span class="stats-ring-pct" id="ringPct">58<small>%</small></span>
          </div>
        </div>
        <div class="stats-quote">
          <span class="stats-quote-text" id="quoteText">« Chaque page lue rapproche ton objectif. »</span>
          <span class="stats-quote-author">— ARVX</span>
        </div>
      </div>

      <!-- ═══ BLOC 1bis — LES DEUX MODES (v0.6.2) ═══
           Position fidèle à l'app de référence (AXIA) : deux
           mini-cartes côte à côte JUSTE AU-DESSOUS de la carte
           statistiques — pas trop grandes mais bien espacées,
           même structure qu'elle : icône en haut, titre au milieu,
           sous-titre en bas (ici : Mode rapide · 5 min, Mode
           focus · cycles 25/5). On reprend la POSITION, pas les
           couleurs de la référence : badges ARVX (or pour le
           rapide, vert pour le focus). Les deux modes seront
           branchés à leur étape — pour l'instant, la carte. -->
      <div class="modes-row" role="group" aria-label="Modes de révision">
        <button type="button" class="mode-card mode-quick" id="modeQuick">
          <span class="mode-icon quick" aria-hidden="true"><i class="fas fa-bolt"></i></span>
          <span class="mode-name" data-i18n="accueil.mode.rapide">Mode rapide</span>
          <span class="mode-sub" data-i18n="accueil.mode.rapideSub">Révision éclair · 5 min</span>
        </button>
        <button type="button" class="mode-card mode-focus" id="modeFocus">
          <span class="mode-icon focus" aria-hidden="true"><i class="fas fa-stopwatch"></i></span>
          <span class="mode-name" data-i18n="accueil.mode.focus">Mode focus</span>
          <span class="mode-sub" data-i18n="accueil.mode.focusSub">Cycles 25 / 5</span>
        </button>
      </div>
    </section>
    <section class="view" id="view-reviser" data-view="reviser" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-examen" data-view="examen" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-progression" data-view="progression" hidden><!-- contenu — étapes suivantes --></section>
    <section class="view" id="view-profil" data-view="profil" hidden><!-- contenu — étapes suivantes --></section>

  </main>

  <!-- ══════════════════════════════════════════════════════
       BARRE DE TÂCHES FIXE EN BAS — design « luxe ».
       Chaque onglet change de vue instantanément (SPA,
       URL synchronisée en #/route — zéro rechargement).
       ══════════════════════════════════════════════════════ -->
  <nav class="bottom-nav" aria-label="Navigation principale">
    <button type="button" class="active" data-route="accueil" aria-current="page">
      <i class="fas fa-home" aria-hidden="true"></i><span data-i18n="nav.accueil">Accueil</span>
    </button>
    <button type="button" data-route="reviser">
      <i class="fas fa-book-open" aria-hidden="true"></i><span data-i18n="nav.reviser">Réviser</span>
    </button>
    <button type="button" data-route="examen">
      <i class="fas fa-pencil-alt" aria-hidden="true"></i><span data-i18n="nav.examen">Examen</span>
    </button>
    <button type="button" data-route="progression">
      <i class="fas fa-chart-line" aria-hidden="true"></i><span data-i18n="nav.progression">Progression</span>
    </button>
    <button type="button" data-route="profil">
      <i class="fas fa-user" aria-hidden="true"></i><span data-i18n="nav.profil">Profil</span>
    </button>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       MODALE DE CONFIRMATION — copie à l'identique du site
       original (index.html:1778-1798). Utilisée d'abord pour
       la déconnexion ; servira aussi aux autres confirmations.
       ══════════════════════════════════════════════════════ -->
  <div class="arvexa-confirm-overlay" id="arvexaConfirmModal">
    <div class="arvexa-confirm-modal">
      <button class="arvexa-confirm-close" id="arvexaConfirmClose" aria-label="Fermer">
        <i class="fas fa-times"></i>
      </button>
      <div class="arvexa-confirm-icon-wrap">
        <div class="arvexa-confirm-icon-box danger" id="arvexaConfirmIconBox">
          <span id="arvexaConfirmIcon">⚠️</span>
        </div>
      </div>
      <h3 class="arvexa-confirm-title" id="arvexaConfirmTitle" data-i18n="confirm.title">Confirmation</h3>
      <div class="arvexa-confirm-divider"></div>
      <p class="arvexa-confirm-message" id="arvexaConfirmMessage" data-i18n="confirm.defaultMessage">Es-tu sûr de vouloir continuer ?</p>
      <div class="arvexa-confirm-actions">
        <button class="arvexa-confirm-btn cancel" id="arvexaConfirmCancel" data-i18n="confirm.cancel">Annuler</button>
        <button class="arvexa-confirm-btn danger" id="arvexaConfirmOk">
          <i class="fas fa-check"></i>
          <span id="arvexaConfirmOkText" data-i18n="confirm.ok">Confirmer</span>
        </button>
      </div>
    </div>
  </div>

</body>
</html>
